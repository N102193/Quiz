<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="آزمون من">
<link rel="manifest" href="manifest.webmanifest">
<title>آزمون من</title>
<style>
:root{
 --primary:#4f46e5;--primary2:#4338ca;--success:#16a34a;--danger:#dc2626;
 --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Tahoma,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:760px;margin:auto;padding:18px 14px 30px}
header{text-align:center;padding:8px 8px 18px}
h1{font-size:27px;margin:8px 0 6px}
header p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 1px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{border:0;background:#e9edf7;color:#475569;border-radius:12px;padding:11px 13px;
 font-size:13px;font-weight:700;white-space:nowrap;min-height:44px}
.tab-btn.active{background:var(--primary);color:white}
.panel{display:none;background:var(--card);padding:15px;border-radius:16px;
 box-shadow:0 4px 18px rgba(15,23,42,.06)}
.panel.active{display:block}
.panel h2{font-size:20px;margin:2px 0 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:0;background:var(--primary);color:#fff;padding:12px 15px;border-radius:11px;
 font-weight:700;min-height:44px;font-size:14px}
.btn.secondary{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#991b1b}
.question-card{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:13px;background:#fbfcff}
.question-number{font-size:12px;color:var(--muted);margin-bottom:6px}
.question-text{font-weight:800;line-height:1.7;font-size:16px;margin-bottom:11px}
.options-list{list-style:none;padding:0;margin:0}
.option-item{padding:13px 12px;border:1px solid var(--border);margin-bottom:7px;border-radius:11px;
 background:white;min-height:48px;display:flex;align-items:center;line-height:1.5}
.option-item:active{transform:scale(.99)}
.option-item.correct{background:#dcfce7;border-color:var(--success);color:#14532d}
.option-item.wrong{background:#fee2e2;border-color:var(--danger);color:#7f1d1d}
.explanation{margin-top:10px;padding:11px;background:#eff6ff;border-right:4px solid #3b82f6;
 border-radius:8px;line-height:1.7;font-size:13px;display:none}
.text-input{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;
 font-size:16px;margin-bottom:9px;outline:none;background:white}
.text-input:focus{border-color:var(--primary)}
.study-item{border-bottom:1px solid var(--border);padding:14px 0;line-height:1.7}
.study-item:last-child{border-bottom:0}
.answer-text{color:var(--success);font-weight:800;margin-top:5px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px}
.empty{text-align:center;color:var(--muted);padding:25px 5px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:5px 0 15px}
.progress>div{height:100%;background:var(--primary);width:0;transition:width .25s}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
@media (min-width:700px){.app{padding-top:28px}.panel{padding:22px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>برنامه هوشمند مطالعه و آزمون</h1>
<p>نسخه مخصوص آیفون — مطالعه، تست‌زنی و پیگیری اشتباهات</p>
</header>

<div class="stats">
 <div class="stat"><b id="statAnswered">0</b><span>پاسخ داده‌شده</span></div>
 <div class="stat"><b id="statCorrect">0</b><span>پاسخ صحیح</span></div>
 <div class="stat"><b id="statWrong">0</b><span>اشتباهات</span></div>
</div>

<div class="tabs">
 <button class="tab-btn active" data-tab="quiz-multiple">چهارگزینه‌ای</button>
 <button class="tab-btn" data-tab="quiz-text">تشریحی</button>
 <button class="tab-btn" data-tab="study-all">همه سؤال‌ها</button>
 <button class="tab-btn" data-tab="mistakes">اشتباهات من</button>
</div>

<div id="quiz-multiple" class="panel active">
 <h2>آزمون چهارگزینه‌ای</h2>
 <div class="toolbar">
  <button class="btn" id="newQuiz">آزمون جدید</button>
  <button class="btn secondary" id="shuffleBtn">تصادفی‌سازی</button>
 </div>
 <div class="progress"><div id="progressBar"></div></div>
 <div id="multiple-questions-container"></div>
</div>

<div id="quiz-text" class="panel">
 <h2>آزمون تشریحی</h2>
 <div id="text-questions-container"></div>
</div>

<div id="study-all" class="panel">
 <h2>بانک کامل سؤال‌ها و جواب‌ها</h2>
 <div id="study-container"></div>
</div>

<div id="mistakes" class="panel">
 <h2>سؤال‌هایی که اشتباه زدی</h2>
 <div id="mistakes-container"></div>
</div>

<div class="footer">اطلاعات پیشرفت روی همین دستگاه ذخیره می‌شود.</div>
</div>

<script>
const questionsData = [
 {id:1,question:"پایتخت کشور ایران کدام شهر است؟",options:["اصفهان","شیراز","تهران","مشهد"],correctIndex:2,correctText:"تهران",explanation:"تهران بزرگ‌ترین شهر و پایتخت اداری و سیاسی ایران است."},
 {id:2,question:"کدام سیاره به سیاره سرخ معروف است؟",options:["زهره","مریخ","مشتری","عطارد"],correctIndex:1,correctText:"مریخ",explanation:"به دلیل وجود اکسید آهن فراوان در سطح مریخ، این سیاره سرخ‌رنگ دیده می‌شود."},
 {id:3,question:"بزرگ‌ترین اقیانوس جهان چه نام دارد؟",options:["اقیانوس اطلس","اقیانوس هند","اقیانوس آرام","اقیانوس منجمد شمالی"],correctIndex:2,correctText:"اقیانوس آرام",explanation:"اقیانوس آرام یا پاسیفیک بزرگ‌ترین و عمیق‌ترین پهنه آبی روی زمین است."}
];

let quizOrder = [...questionsData];
let progress = JSON.parse(localStorage.getItem("quizProgress") || '{"answered":0,"correct":0,"wrong":0,"mistakes":[]}');

function saveProgress(){localStorage.setItem("quizProgress",JSON.stringify(progress));updateStats();renderMistakes();}
function updateStats(){
 document.getElementById("statAnswered").textContent=progress.answered;
 document.getElementById("statCorrect").textContent=progress.correct;
 document.getElementById("statWrong").textContent=progress.wrong;
}
function switchTab(tabId,button){
 document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
 document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
 document.getElementById(tabId).classList.add("active");
 if(button)button.classList.add("active");
}
document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab,b)));

function answerQuestion(q, selectedIndex, optionsList, expBox){
 if(optionsList.classList.contains("answered")) return;
 if(selectedIndex===q.correctIndex){
  optionsList.children[selectedIndex].classList.add("correct");
  progress.correct++;
 }else{
  optionsList.children[selectedIndex].classList.add("wrong");
  optionsList.children[q.correctIndex].classList.add("correct");
  progress.wrong++;
  if(!progress.mistakes.includes(q.id))progress.mistakes.push(q.id);
 }
 progress.answered++;
 optionsList.classList.add("answered");
 expBox.style.display="block";
 saveProgress();
 const answered=document.querySelectorAll("#multiple-questions-container .options-list.answered").length;
 const total=quizOrder.length;
 document.getElementById("progressBar").style.width=(total ? answered/total*100 : 0)+"%";
}

function renderMultipleChoice(){
 const container=document.getElementById("multiple-questions-container");container.innerHTML="";
 quizOrder.forEach((q,qIdx)=>{
  const card=document.createElement("div");card.className="question-card";
  card.innerHTML='<div class="question-number">سؤال '+(qIdx+1)+' از '+quizOrder.length+'</div>';
  const qText=document.createElement("div");qText.className="question-text";qText.textContent=q.question;card.appendChild(qText);
  const optionsList=document.createElement("ul");optionsList.className="options-list";
  const expBox=document.createElement("div");expBox.className="explanation";expBox.textContent="توضیح: "+q.explanation;
  q.options.forEach((opt,oIdx)=>{
   const li=document.createElement("li");li.className="option-item";li.textContent=opt;
   li.addEventListener("click",()=>answerQuestion(q,oIdx,optionsList,expBox));
   optionsList.appendChild(li);
  });
  card.append(optionsList,expBox);container.appendChild(card);
 });
 document.getElementById("progressBar").style.width="0%";
}

function normalize(s){return s.trim().toLowerCase().replace(/\s+/g," ")}
function renderTextAnswers(){
 const container=document.getElementById("text-questions-container");container.innerHTML="";
 questionsData.forEach((q,qIdx)=>{
  const card=document.createElement("div");card.className="question-card";
  const qText=document.createElement("div");qText.className="question-text";qText.textContent=(qIdx+1)+". "+q.question;
  const input=document.createElement("input");input.className="text-input";input.placeholder="پاسخ خود را اینجا بنویسید...";
  const btn=document.createElement("button");btn.className="btn";btn.textContent="بررسی پاسخ";
  const exp=document.createElement("div");exp.className="explanation";
  btn.onclick=()=>{
   const given=normalize(input.value), correct=normalize(q.correctText);
   const ok=given===correct || (given && correct.includes(given)) || (given && given.includes(correct));
   exp.innerHTML="<strong>"+(ok?"پاسخ قابل قبول است":"پاسخ صحیح: "+q.correctText)+"</strong><br><br>"+q.explanation;
   exp.style.display="block";input.disabled=true;btn.disabled=true;
   progress.answered++; ok?progress.correct++:progress.wrong++;
   if(!ok && !progress.mistakes.includes(q.id))progress.mistakes.push(q.id);
   saveProgress();
  };
  card.append(qText,input,btn,exp);container.appendChild(card);
 });
}
function renderStudyAll(){
 const container=document.getElementById("study-container");container.innerHTML="";
 questionsData.forEach((q,i)=>{
  const item=document.createElement("div");item.className="study-item";
  item.innerHTML='<div class="question-text">'+(i+1)+". "+q.question+'</div><div class="answer-text">پاسخ: '+q.correctText+'</div><div style="margin-top:5px;color:#64748b;font-size:13px">نکته آموزشی: '+q.explanation+'</div>';
  container.appendChild(item);
 });
}
function renderMistakes(){
 const c=document.getElementById("mistakes-container");c.innerHTML="";
 const mistakes=questionsData.filter(q=>progress.mistakes.includes(q.id));
 if(!mistakes.length){c.innerHTML='<div class="empty">هنوز سؤال اشتباهی ثبت نشده است.</div>';return}
 mistakes.forEach(q=>{
  const item=document.createElement("div");item.className="study-item";
  item.innerHTML='<span class="badge">مرور</span><div class="question-text">'+q.question+'</div><div class="answer-text">پاسخ صحیح: '+q.correctText+'</div><div style="margin-top:5px;color:#64748b;font-size:13px">'+q.explanation+'</div>';
  c.appendChild(item);
 });
}
document.getElementById("newQuiz").onclick=()=>{quizOrder=[...questionsData];renderMultipleChoice()};
document.getElementById("shuffleBtn").onclick=()=>{
 quizOrder=[...questionsData].sort(()=>Math.random()-0.5);renderMultipleChoice();
};
updateStats();renderMultipleChoice();renderTextAnswers();renderStudyAll();renderMistakes();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body>
</html>
