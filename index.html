<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آمادگی امتحان Sicherungsposten</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1c2733;--mute:#5d6b79;--line:#d5dce3;--vest:#f2cf00;--ok:#1f7a4d;--okbg:#e3f4ea;--bad:#b8322c;--badbg:#fbe7e5;--mid:#a86a00;--midbg:#fff1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a22;--card:#1a2631;--ink:#e9eef3;--mute:#93a3b3;--line:#2d3b48;--okbg:#153626;--badbg:#3d1c1a;--midbg:#3a2e10;--ok:#5fd394;--bad:#ff8a80;--mid:#f0b84d}}
:root[data-theme="dark"]{--bg:#111a22;--card:#1a2631;--ink:#e9eef3;--mute:#93a3b3;--line:#2d3b48;--okbg:#153626;--badbg:#3d1c1a;--midbg:#3a2e10;--ok:#5fd394;--bad:#ff8a80;--mid:#f0b84d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:84px}
header{background:#1c2733;color:#fff;padding:14px 16px 12px;border-bottom:6px solid var(--vest);background-image:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(242,207,0,.0) 10px 20px)}
header h1{margin:0;font-size:19px;font-weight:800}
header p{margin:0;font-size:13px;color:#b9c5d1}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.de{direction:ltr;text-align:left;unicode-bidi:isolate}
.q{font-size:18px;font-weight:600;line-height:1.6}
.qn{display:inline-block;background:var(--vest);color:#1c2733;font-weight:800;font-size:13px;border-radius:6px;padding:0 8px;margin-bottom:6px}
ul{margin:4px 0;padding-inline-start:20px}.de ul{padding-inline-start:0;padding-left:20px}
li{margin:2px 0}
p{margin:4px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.pri{background:#1c2733;color:#fff;border-color:#1c2733;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{background:var(--vest);color:#1c2733;border-color:var(--vest)}}
:root[data-theme="dark"] button.pri{background:var(--vest);color:#1c2733;border-color:var(--vest)}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip.on{background:var(--vest);color:#1c2733;border-color:var(--vest);font-weight:600}
.opt{display:block;width:100%;text-align:left;direction:ltr;margin:8px 0;padding:10px 12px;line-height:1.55;font-size:15px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--ok)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}
textarea{width:100%;min-height:130px;font:15px/1.6 system-ui,sans-serif;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
.fb{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb.mid{background:var(--midbg);color:var(--mid)}
.pt{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.pt:last-child{border:0}.pt b{flex:none;width:22px}
.pt.y b{color:var(--ok)}.pt.n b{color:var(--bad)}.pt.h b{color:var(--mid)}
.big{font-size:40px;font-weight:800;line-height:1.2}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{padding:10px 12px;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
details .body{padding:0 12px 10px;border-top:1px solid var(--line)}
.flag{color:var(--bad);font-size:12px;margin-inline-start:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 4px;font-size:14px;color:var(--mute)}
nav button.on{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--vest)}
h2{font-size:17px;margin:0 0 8px}
.mute{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header><h1>آمادگی امتحان سیشرونگ‌پوستن (SiPo)</h1><p id="sub"></p></header>
<main id="app"></main>
<nav>
<button data-v="mc">چندگزینه‌ای</button>
<button data-v="wr">پاسخ نوشتاری</button>
<button data-v="all">مرور همه سؤال‌ها</button>
</nav>
<script>
const D=[{"n": 1, "q": "Nennen Sie die Unfallverhütungsvorschriften, die Sie als Sicherungsposten kennen müssen?", "a": ["DGUV Vorschrift 78 DGUV Regel 101-024 DGUV Information 201-021"]}, {"n": 2, "q": "In welcher Richtlinie finden Sie Informationen über den Sicherungsposten?", "a": ["Rahmenrichtlinie 132.0118"]}, {"n": 3, "q": "Welche Voraussetzungen müssen Sie für die Tätigkeit als Sicherungsposten erfüllen?", "a": ["Das 18. Lebensjahr vollendet haben.", "Körperlich und geistig geeignet sein.", "Ausgebildet und geprüft sein.", "Regelmäßig fortgebildet werden.", "Deutsch in Wort und Schrift beherrschen."]}, {"n": 4, "q": "Was muss bei der regelmäßigen Fortbildung beachtet werden?", "a": ["Die Fortbildung muss kalenderjährlich stattfinden.", "Es gibt keine Nachfrist.", "Wird die Frist überschritten, ruht die Einsatzerlaubnis.", "Erfolgt die Fortbildung innerhalb von 24 Monaten nach Beginn des Ruhens, darf der Sicherungsposten wieder eingesetzt werden.", "Nach mehr als 24 Monaten ist eine erneute Prüfung erforderlich.", "Zusätzliche Fortbildungen können bei Neuerungen notwendig sein."]}, {"n": 5, "q": "Nennen Sie die Pflichten eines Sicherungspostens.", "a": ["Teilnahme an Fortbildungen.", "Vor gefährdenden Fahrten warnen.", "Warnsignale sofort weitergeben und quittieren.", "Ruhepausen einhalten.", "Befähigungsausweis (ElBa) mitführen."]}, {"n": 6, "q": "Nennen Sie die Rechte eines Sicherungspostens.", "a": ["Recht auf Fortbildung.", "Recht auf Warnmittel und Warnkleidung.", "Recht auf Pausen und Ruhezeiten.", "Recht auf Einweisung in die bahnbetrieblichen Verhältnisse."]}, {"n": 7, "q": "Was passiert, wenn Sie keinen Fortbildungsunterricht durchführen?", "a": ["Die Einsatzerlaubnis ruht und der Sicherungsposten darf erst nach erfolgreicher Fortbildung wieder eingesetzt werden."]}, {"n": 8, "q": "Was gehört zur Ausrüstung des Sicherungspostens?", "a": ["Warnkleidung (mindestens Warnweste nach DIN EN ISO 20471)", "Mehrklangsignalhorn Signalfahne Rot abblendbare Taschenlampe Befähigungsausweis (ElBa)"]}, {"n": 9, "q": "Welche Ausrüstung ist zusätzlich erforderlich?", "a": ["Wetterschutzkleidung Sicherheitsschuhe Vierkantschlüssel Uhr Kleidung, die das Seh- oder Hörvermögen einschränkt, ist verboten."]}, {"n": 10, "q": "Nennen Sie mögliche Probleme in Ihrer Funktion als Sicherungsposten.", "a": ["Schlechte Tagesform Müdigkeit Schlafmangel Stress Erkrankung Alkohol- oder Drogenkonsum"]}, {"n": 11, "q": "Welche Folgen können Alkohol oder Drogen haben?", "a": ["Wahrnehmungsstörungen Verminderte Reaktionsfähigkeit Müdigkeit Unachtsamkeit"]}, {"n": 12, "q": "Welche Inhalte kann ich im ElBa entnehmen?", "a": ["Lichtbild Vor- und Zuname Persönliche ID Sicherungsunternehmen Check-in / Check-out Qualifikationen Tauglichkeit"]}, {"n": 13, "q": "Welche Pausenregelungen gelten?", "a": ["Bis zu 8 Stunden Arbeit: spätestens nach 6 Stunden mindestens 30 Minuten Pause.", "Bis zu 10 Stunden Arbeit: zusätzlich 15 Minuten Pause."]}, {"n": 14, "q": "Welche Regelungen zur Ruhezeit gelten?", "a": ["Mindestens 11 Stunden ununterbrochene Ruhezeit."]}, {"n": 15, "q": "Zwischen welchen zwei Gefahrengruppen wird unterschieden?", "a": ["Gefahren aus dem Arbeitsprozess Gefahren aus dem Bahnbetrieb"]}, {"n": 16, "q": "Was sind Gefahren aus dem Bahnbetrieb?", "a": ["Bewegte Schienenfahrzeuge Fahrleitung Fernbediente Gleiseinrichtungen Rückströme in den Fahrschienen"]}, {"n": 17, "q": "Nennen Sie Gefahrenquellen aus dem Arbeitsprozess.", "a": ["Absturzgefahr Quetschgefahr Stolpergefahr Funkenflug Rotierende Gegenstände Bewegliche Teile Heiße Gegenstände"]}, {"n": 18, "q": "Wer ist verantwortlich für die Abwendung der Gefahren aus der Arbeit?", "a": ["Der bauausführende Unternehmer bzw. die Arbeitsaufsicht oder der Bauleiter."]}, {"n": 19, "q": "Wer ist verantwortlich für die Abwendung der Gefahren aus dem Bahnbetrieb?", "a": ["Die für den Bahnbetrieb zuständige Stelle."]}, {"n": 20, "q": "Wie verhalten Sie sich bei herabhängenden Teilen der Fahrleitung?", "a": ["Sicherungsaufsicht verständigen.", "Bereich mit kleinen Schritten verlassen.", "Mindestens 10 Meter Abstand halten.", "Bereich absperren.", "Niemanden hineinlassen.", "Fahrten anhalten.", "Gegebenenfalls Nothaltauftrag veranlassen."]}, {"n": 21, "q": "Wie groß ist die Spannung der Oberleitung?", "a": ["15.000 Volt"]}, {"n": 22, "q": "Wie groß ist der Abstand zu spannungsführenden Teilen?", "a": ["1,50 m für besonders unterwiesene Personen 3,00 m für elektrotechnische Laien"]}, {"n": 23, "q": "Welche Schienenfahrzeuge sind gefährlich?", "a": ["Grundsätzlich alle bewegten Schienenfahrzeuge. Auch stehende Fahrzeuge können sich plötzlich in Bewegung setzen."]}, {"n": 24, "q": "Warum können Beschäftigte durch Luftdruck und Sogwirkung gefährdet werden?", "a": ["Kleidung kann sich aufblähen.", "Personen können gegen den Zug gedrückt oder angesaugt werden.", "Gegenstände können mitgerissen werden."]}, {"n": 25, "q": "Welche Gefahr besteht auf elektrisch betriebenen Strecken?", "a": ["Herabhängende Leitungen Stromschlag Defekte Erdungseinrichtungen"]}, {"n": 26, "q": "Wer ist verantwortlich für die Abwendung der speziellen Gefahren auf elektrisch betriebenen Strecken?", "a": ["Der Bahnbetreiber in Abstimmung mit dem Arbeitsverantwortlichen des ausführenden Unternehmens."]}, {"n": 27, "q": "Warum warnt der Sicherungsposten nur vor Gefahren durch bewegte Schienenfahrzeuge?", "a": ["Weil der Sicherungsposten nur für diese Gefahren verantwortlich und ausgebildet ist."]}, {"n": 28, "q": "Worauf muss der Sicherungsposten bei vorbeifahrenden Zügen achten?", "a": ["Verschobene Ladung Flatternde Wagendecken Lose Drähte Herausgeworfene Gegenstände Offene Türen Lose Fahrzeugteile Feuer Zugspitzensignal (Zg1)", "Zugschlusssignal (Zg2)"]}, {"n": 29, "q": "Was ist der Gefahrenbereich?", "a": ["Der Bereich neben dem Gleis, in dem Personen durch vorbeifahrende Schienenfahrzeuge sowie deren Druck- und Sogwirkung gefährdet werden können."]}, {"n": 30, "q": "Erklären Sie den Begriff „Gleisbereich\".", "a": ["Der von bewegten Schienenfahrzeugen beanspruchte Raum.", "Der Raum unter, neben oder über Gleisen, in dem Personen gefährdet werden können.", "Dazu gehört auch der Bereich der Fahrleitung.", "Der Gleisbereich schließt den Gefahrenbereich ein."]}, {"n": 31, "q": "Was bedeutet der Begriff „Sicherheitsraum\" und wie wird er bemessen?", "a": ["Raum, in dem Arbeitskräfte vor bewegten Schienenfahrzeugen geschützt sind.", "Mindestens 0,5 m auf der gleisfreien Seite.", "Mindestens 0,8 m zwischen zwei Gleisen.", "Mindestens 2,0 m Höhe."]}, {"n": 32, "q": "Was ist ein Arbeitsgleis?", "a": ["Ein Arbeitsgleis ist das Gleis, in dem die Arbeiten durchgeführt werden."]}, {"n": 33, "q": "Erklären Sie den Begriff Nachbargleis.", "a": ["Nachbargleise sind nebeneinander liegende Gleise mit einem Abstand von weniger als 0,8 m zwischen den Gleisbereichen."]}, {"n": 34, "q": "Was ist ein Innengleis?", "a": ["Ein Innengleis ist ein Gleis, das zu beiden Seiten ein Nachbargleis hat."]}, {"n": 35, "q": "Was ist eine Zugfahrt?", "a": ["Eine auf die freie Strecke übergehende oder innerhalb eines Bahnhofs verkehrende Bewegung von Triebfahrzeugen oder Einheiten.", "Fährt nach Fahrplan.", "Hat eine Zugnummer.", "Führt Zugspitzensignal (Zg1) und Zugschlusssignal (Zg2)."]}, {"n": 36, "q": "Was ist eine Rangierfahrt?", "a": ["Rangieren ist das Bewegen von Fahrzeugen im Bahnbetrieb, ausgenommen das Fahren der Züge."]}, {"n": 37, "q": "Was ist eine Sperrfahrt?", "a": ["Sperrfahrten sind Züge oder Kleinwagenfahrten, die in ein Gleis der freien Strecke eingelassen werden, das gesperrt ist."]}, {"n": 38, "q": "Mit welcher Geschwindigkeit dürfen Sperrfahrten verkehren?", "a": ["Gezogene Sperrfahrt: 50 km/h Geschobene Sperrfahrt: 30 km/h"]}, {"n": 39, "q": "Es dürfen in ein gesperrtes Streckengleis Sperrfahrten in den gleichen Abschnitt eingelassen werden. Was bedeutet das für Ihre Tätigkeit?", "a": ["In einem gesperrten Gleis der freien Strecke können mehrere Sperrfahrten in beide Richtungen verkehren."]}, {"n": 40, "q": "Ergänzen Sie die zulässigen Geschwindigkeiten.", "a": ["Rangierfahrten → 25 km/h Rangierfahrten im Baugleis → 20 km/h Sperrfahrten gezogen → 50 km/h Zugfahrten nach VzG und Fahrplan → bis 250 km/h Sperrfahrten geschoben → 30 km/h"]}, {"n": 41, "q": "Woher weiß der Sicherungsposten, mit welcher Geschwindigkeit im Arbeitsgleis bzw. Nachbargleis gefahren werden darf?", "a": ["Durch die Sicherungsaufsicht."]}, {"n": 42, "q": "Was ist ein Baugleis?", "a": ["Ein Baugleis ist ein gesperrtes Gleis, das der Fahrdienstleiter unter Beachtung einer gültigen Betriebs- und Bauanweisung (Betra) zum Baugleis erklärt hat.", "Die Verantwortung für die Betriebsführung liegt nicht mehr beim Fahrdienstleiter.", "Das Fahren im Baugleis regelt die in der Betra genannte Person (meist der Technisch Berechtigte).", "Sh2-Scheiben kennzeichnen das Baugleis."]}, {"n": 43, "q": "Wie erkennen Sie, dass eine Zugfahrt oder Rangierfahrt auf Sie zukommt oder sich von Ihnen wegbewegt?", "a": ["Zg1 (Zugspitzensignal): Drei weiße Lichter in Form eines „A“.", "Zg2 (Zugschlusssignal): 1: Zwei rote Lichter (können blinken).", "2: Oder zwei rechteckige reflektierende Schilder mit weißen Dreiecken.", "Fz1 (Fahrzeugsignal): Vorn und hinten ein weißes Licht in Höhe der Puffer."]}, {"n": 44, "q": "Mit welchen Signalmitteln können Warnsignale gegeben werden?", "a": ["Mehrklangsignalhorn Elektrischer Warnsignalgeber / Elektrisches Einzelhorn Automatisches Warnsystem"]}, {"n": 45, "q": "Warnsignale Ro1 bis Ro6: Signalgebung, Bedeutung, Verhalten", "a": ["Ro1 bis Ro6 Ro1 Signalgebung: Mit dem Horn ein langer Ton als Mischklang aus zwei verschieden hohen Tönen. Bedeutung: Vorsicht! Im Nachbargleis nähern sich Fahrzeuge. Verhalten: Evtl. Arbeiten unterbrechen und Fahrten beobachten.", "Ro2 Signalgebung: Mit dem Horn zwei lange Töne nacheinander in verschiedener Tonlage. Bedeutung: Arbeitsgleis räumen. Verhalten: • Arbeiten einstellen. • Gleisbereich verlassen. • Sicherheitsraum aufsuchen. • Werkzeuge ablegen. • Zugfahrt beobachten.", "Ro3 Signalgebung: Mindestens fünfmal zwei kurze Töne nacheinander in verschiedener Tonlage. Bedeutung: Arbeitsgleis schnellstens räumen. Verhalten: • Schnellstmöglich Sicherheitsraum aufsuchen. • Geräte und Werkzeuge liegen lassen. • Zugfahrt beobachten.", "Ro4 Signalgebung: Ein weißes Fahnenschild mit schwarzem Rand. Bedeutung: Kennzeichnung der Gleisseite bzw. des Sicherheitsraumes. Verhalten: Nach Ertönen des Signals zu dieser Seite austreten.", "Ro5 Signalgebung: Zwei lange Tonfolgen nacheinander. Bedeutung: Gefahrenraum räumen und meiden. Verhalten: • Arbeiten einstellen. • Sicherheitsraum aufsuchen. • Werkzeuge ablegen. • Zugfahrt beobachten.", "Ro6 Signalgebung: Mindestens fünf kurze Tonfolgen nacheinander. Bedeutung: Gefahrenraum schnellstens räumen. Verhalten: • Sofort Sicherheitsraum aufsuchen. • Geräte im Gleisbereich liegen lassen. • Zugfahrt beobachten."]}, {"n": 46, "q": "Was bedeutet das Signal Sh2 und wie ist es zu erkennen?", "a": ["Schutzhalt.", "Erkennbar an:", "einer rechteckigen roten Scheibe mit weißem Rand, oder einem roten Licht bei Nacht."]}, {"n": 47, "q": "Welche Bedeutung hat das Signal Sh3 für den Sicherungsposten?", "a": ["Sofort halten.", "Das Kreissignal wird gegeben, wenn ein Zug oder eine Rangierfahrt sofort zum Halten gebracht werden muss."]}, {"n": 48, "q": "Welche Signale sind für die Tätigkeit des Sicherungspostens von Bedeutung?", "a": ["Ro1 bis Ro6 / Zg1 und Zg2 Sh2 und Sh3 , Sh5 , Fz1"]}, {"n": 49, "q": "Was ist ein Bahnhof?", "a": ["Eine Bahnanlage mit mindestens einer Weiche, wo Züge beginnen und enden, halten, wenden, kreuzen und überholen."]}, {"n": 50, "q": "Was sind die Grenzen eines Bahnhofs?", "a": ["Einfahrsignale Einfahrweiche Trapeztafel"]}, {"n": 51, "q": "Wie werden Fahrten auf der freien Strecke genannt?", "a": ["Fahrten auf dem Regelgleis Fahrten auf dem Gegengleis"]}, {"n": 52, "q": "Welche Aufgaben hat der Sicherungsposten zu erfüllen?", "a": ["Für das Verlassen des Gleisbereiches sorgen.", "Ro-Signale weitergeben und quittieren.", "Im Notfall dem Triebfahrzeugführer Sh3 (Kreissignal) geben.", "Warnmittel auf Funktion prüfen.", "Verhalten der Versicherten beobachten."]}, {"n": 53, "q": "Aufgaben des Außenpostens", "a": ["Beginn der Annäherungsstrecke beobachten.", "Ro-Signal sofort an den Innen-/Zwischenposten weitergeben.", "Auf Quittierung warten.", "Ggf. Ro3 oder Ro6 geben.", "Ggf. Sh3 oder Sh5 geben."]}, {"n": 54, "q": "Aufgaben des Zwischenpostens", "a": ["Den einsehbaren Teil der Annäherungsstrecke beobachten.", "Ro-Signal sofort an den Innenposten weitergeben.", "Auf Quittierung des Innenpostens warten.", "Warnsignal des Außenpostens quittieren.", "Ggf. Ro3 und Sh3 geben."]}, {"n": 55, "q": "Aufgaben des Innenpostens", "a": ["Den einsehbaren Teil der Annäherungsstrecke beobachten.", "Ro-Signal sofort an die zu sichernden Personen weitergeben.", "Dem Zwischen-/Außenposten zeitnah bestätigen.", "Verhalten der Versicherten beobachten.", "Ggf. Ro3 oder Ro6 geben.", "Ggf. Sh3 oder Sh5 geben."]}, {"n": 56, "q": "Welche Aufgabe hat ein Absperrposten?", "a": ["Er hindert Beschäftigte am Betreten eines Gleisbereiches."]}, {"n": 57, "q": "Welche Qualifikation muss ein Absperrposten haben?", "a": ["Sicherungsposten (SiPo)."]}, {"n": 58, "q": "Welche Voraussetzungen müssen im Arbeitsgleis beim Einsatz von Absperrposten erfüllt sein?", "a": ["Das Arbeitsgleis muss gesperrt sein.", "Es dürfen Sperr- oder Rangierfahrten verkehren.", "Für die Beschäftigten muss ein Sicherheitsraum vorhanden sein."]}, {"n": 59, "q": "Was ist vor Einsatz eines Absperrpostens auf jeden Fall durchzuführen?", "a": ["Eine örtliche Einweisung durch die Sicherungsaufsicht.", "Absperrposten und Arbeitskräfte müssen zusammen eingewiesen werden."]}, {"n": 60, "q": "Wo müssen Absperrposten stehen?", "a": ["Der Standort liegt außerhalb des Gleisbereiches im Zugriffsbereich auf die zu sichernden Personen.", "Dabei muss gewährleistet sein, dass er:", "sich n Arbeitsstellen dar (in der Reihenfolge der Gesprächsabwicklung zwischen Fahrdienstleiter und Arbeitsstelle/Meldeposten).", "a": ["Fdl: Zug 4711 von Adorf nach Bstadt.", "Meldeposten:", "Ich wiederhole: Zug 4711 von Adorf nach Bstadt.", "Fdl: Richtig."]}, {"n": 76, "q": "Wie ist zu verfahren, wenn die Benachrichtigung nicht mehr erforderlich ist?", "a": ["Der Meldeposten an der Arbeitsstelle teilt dem Fahrdienstleiter mit, wenn die Benachrichtigung über Zugfahrten nicht mehr erforderlich ist."]}, {"n": 77, "q": "Welche Aufgaben hat die Sicherungsaufsicht in Bezug auf die Tätigkeit des Sicherungspostens nach der DGUV Regel 101-024 Abschnitt 4.1?", "a": ["Unterweisung der Sicherungsposten Auswahl der Standorte der Sicherungsposten Anzahl der Sicherungsposten festlegen Warnmittel festlegen Warnsignal festlegen Zeichen für das Quittieren oder das Aufheben für falsch oder irrtümlich gegebene Signale festlegen Wahrnehmbarkeitsprobe durchführen"]}, {"n": 78, "q": "Welche Informationen erwarten Sie von der Sicherungsaufsicht bei Ihrer Unterweisung?", "a": ["Zuweisung des Standortes Wege zur und von der Arbeitsstelle Beginn der Annäherungsstrecke (markanter Punkt)", "Festgelegtes Warnsignal Verhalten bei Nichtbefolgung der Warnsignale (Innengleis)", "Austrittsseite der Versicherten Betriebsverhältnisse Arbeits- und Pausenzeiten"]}, {"n": 79, "q": "Wann müssen Sicherungsmaßnahmen angepasst werden? Nennen Sie Gründe für die Anpassung von Sicherungsmaßnahmen.", "a": ["Die Fahrt kann am Beginn der Annäherungsstrecke nicht erkannt werden.", "Die Sicht- und Hörverbindung zwischen den Sicherungsposten bzw. zu den Versicherten ist nicht mehr gewährleistet.", "Mögliche Gründe:", "Witterungsbedingungen (unsichtiges Wetter durch Nebel, Schnee, Regen, Dunkelheit usw.)", "Sonstige Sichtbehinderungen (z. B. abgestellte Züge, abgestellte Straßenfahrzeuge, Rauch usw.)", "Zusätzlicher bzw. veränderter Störschall Ausfall von Sicherungsposten"]}, {"n": 80, "q": "Wer ist Ihnen auf der Arbeitss rne Schienenkontakte haben bereits zwei Einschaltungen integriert.", "Die Ausschaltung ist nicht im selben Maße sicherheitsrelevant. Sollte ein Zug nicht ausgeschaltet werden, so bleibt die Baustelle lediglich länger in Warnung als notwendig. Der Fehler kann zeitnah behoben werden und die Ausschaltung ggf. vorübergehend über die Zentrale erfolgen."]}, {"n": 86, "q": "Überlegen und notieren Sie, warum die Aufstellung von WSG in der Regel in 15° Aufstellung erfolgen muss und warum die Ausrichtung von Wohnbebauung wegzeigen sollte?", "a": ["Die 15°-Aufstellung bietet den Vorteil, dass der Warnsignalpegel sich optimal auf der Baustelle ausbreitet und weniger in Richtungen strahlt, die nicht bewarnet werden müssen.", "Bei Wohnbebauung (ausschließlich einer Richtung) kann die Lärmbelästigung der Anwohner durch gezieltes Ausrichten (weg von der Wohnbebauung) zusätzlich vermindert werden."]}, {"n": 87, "q": "Überlegen Sie welche Vor- und Nachteile persönliche Warngerber haben.", "a": ["Vorteile:", "Keine bzw. äußerst geringe Belastung der Umwelt durch Schall von kollektiven Warngebern.", "Störschall auch sehr lauter Arbeitsmaschinen kann problemlos abgedeckt werden.", "Schnelle Installation.", "Äußerst mobile Arbeitsmöglichkeiten.", "Nachteile:", "Zusätzlich auf der Arbeitsstelle erscheinende Personen können nicht über das ATWS gesichert werden.", "Die persönlichen Warngeber müssen von den zu schützenden Personen getragen werden."]}, {"n": 88, "q": "Wann und warum ist ein Vier-Augen-Prinzip beim Einsatz von ATWS notwendig?", "a": ["Der ATWS-Plan wird geprüft ( durch den Planprüfer bei der BZS oder ggf. im Sicherungsunternehmen) geprüft.", "Die Montage wird bei der technischen Funktionsabnahme geprüft.", "Diese Schritte sind sinnvoll und notwendig, um die Gefahr menschlicher Fehler zu verringern bzw. zu vermeiden."]}, {"n": 89, "q": "Diskutieren Sie die Unterschiede zwischen den Sicherungsmaßnahmen „Sicherung mit Absperrposten“ und „Einsatz von Sicherungsposten“.", "a": ["Be ": "Welche Möglichkeiten zur Einschaltung von ATWS sind bahntechnisch zugelassen?", "a": ["Technische Detektion Handschaltung"]}, {"n": 96, "q": "Welche Möglichkeiten der Signalübertragung eines ATWS gibt es?", "a": ["Kabel Funk"]}, {"n": 97, "q": "Welche Warnkleidung ist im Gleisbereich von Arbeitskräften zu tragen und welche als Sicherungspersonal?", "a": ["Arbeitskräfte tragen orangefarbene Warnkleidung.", "Sicherungspersonal trägt gelb fluoreszierende Warnkleidung."]}, {"n": 98, "q": "Erklären Sie den Begriff Räumzeit.", "a": ["Die Zeit, die benötigt wird, um den Gleisbereich ohne Hast mit allen Geräten und Werkzeugen räumen zu können."]}, {"n": 99, "q": "Erklären Sie den Begriff Annäherungsstrecke.", "a": ["Strecke, die eine Fahrt innerhalb der Sicherheitsfrist zurücklegt.", "Strecke, an deren Beginn der Sicherungsposten die Fahrt sicher erkennen muss."]}, {"n": 100, "q": "Was ist der Sicherheitszuschlag?", "a": ["Zeit, die nach dem Räumen des Gleisbereiches bis zum Eintreffen der Fahrt verbleiben muss. Schließt die Weitergabe der Ro-Signale ein."]}, {"n": 101, "q": "Was ist die Sicherheitsfrist?", "a": ["Die Summe aus Räumzeit und Sicherheitszuschlag."]}, {"n": 102, "q": "Gefahrenbereich und Nachbargleis (Gleisabstand)", "a": ["Gefahrenbereich Gleis 1 = 2,30 m Gefahrenbereich Gleis 2 = 2,20 m Bis zu einem Gleisabstand von 5,30 m gilt Gleis 2 als Nachbargleis.", "Ab über 5,30 m gilt Gleis 2 nicht mehr als Nachbargleis."]}, {"n": 103, "q": "Stellen Sie anhand der Angaben fest, ob es sich um ein Nachbargleis handelt oder nicht. a) Wie hoch ist der geschwindigkeitsabhängige Gefahrenbereich und ist es ein Nachbargleis?", "a": ["Gleis 1: 2,20 m Gleis 1 und Gleis 2 ein Nachbargleis?", "Kein Nachbargleis (2,20 + 2,30 + 0,80 = 5,30 m)", "Gleis 2: 2,30 m Gleis 2 und Gleis 3 ein Nachbargleis?", "Nachbargleis (2,30 + 2,40 + 0,80 = 5,50 m)", "Gleis 3: 2,40 m Gleis 4: 2,20 m Gleis 3 und Gleis 4 ein Nachbargleis?", "Nachbargleis (2,40 + 2,20 + 0,80 = 5,40 m)", "b) Welche(s)   app.innerHTML=`<div class="card"><h2>${title}</h2><p class="mute">${desc}</p>
  <p>تعداد سؤال:</p><div class="row">${counts.map(c=>`<button class="chip ${cfg.count===c?'on':''}" data-c="${c}">${c===items.length?'همه':fa(c)}</button>`).join('')}</div>
  <p>منبع سؤال‌ها:</p><div class="row"><button class="chip ${!cfg.only?'on':''}" data-o="0">همه سؤال‌ها</button><button class="chip ${cfg.only?'on':''}" data-o="1">فقط اشتباه‌های من (${fa(wrong.size)})</button></div>
  <p><button class="pri" id="go">شروع</button></p></div>`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cfg.count=+b.dataset.c;renderSetup()});
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{cfg.only=b.dataset.o==='1';renderSetup()});
  $('#go').onclick=()=>{
    let pool=cfg.only?items.filter(x=>wrong.has(x.n)):items;
    if(!pool.length){app.insertAdjacentHTML('beforeend','<div class="fb bad">هنوز اشتباهی ثبت نشده است. ابتدا با همه‌ی سؤال‌ها تمرین کنید.</div>');return}
    S={list:shuffle(pool).slice(0,cfg.count),i:0,score:0,bad:[],done:false};
    render();
  };
}

function head(){return `<div class="meta"><span>سؤال ${fa(S.i+1)} از ${fa(S.list.length)}</span><span>امتیاز: ${fa(Math.round(S.score*10)/10)}</span></div><div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div>`}

function mark(x,ok){ if(ok)wrong.delete(x.n); else{wrong.add(x.n);S.bad.push(x)} save(); setSub(); }

function renderMC(){
  const x=S.list[S.i];
  if(!S.opts||S.opts.n!==x.n){
    const L=x.a.join(' ').length, key=o=>o.a.join(' ');
    let pool=items.filter(o=>o.n!==x.n&&key(o)!==key(x));
    const near=shuffle(pool.filter(o=>{const l=key(o).length;return l>L*.4&&l<L*2.5}));
    const rest=shuffle(pool.filter(o=>!near.includes(o)));
    const d=[...near,...rest].slice(0,3);
    S.opts={n:x.n,list:shuffle([x,...d]),picked:null};
  }
  const o=S.opts;
  app.innerHTML=head()+`<div class="card">${qHtml(x)}</div><div id="opts">${o.list.map((c,i)=>`<button class="opt" data-i="${i}" ${o.picked!==null?'disabled':''}>${ansHtml(c)}</button>`).join('')}</div><div id="fb"></div>`;
  const btns=[...app.querySelectorAll('.opt')];
  const reveal=()=>{
    btns.forEach((b,i)=>{b.disabled=true;if(o.list[i]===x)b.classList.add('right');else if(i===o.picked)b.classList.add('wrong')});
    const p=o.list[o.picked];let h;
    if(p===x)h='<div class="fb ok">✓ درست است.</div>';
    else h=`<div class="fb bad"><b>✗ نادرست.</b> پاسخی که انتخاب کردید مربوط به سؤال دیگری است: <div class="de" style="margin-top:6px"><b>Aufgabe ${p.n}</b> – ${esc(p.q)}</div><p style="margin-top:6px">پاسخ درست این سؤال همان گزینه‌ی سبز است. دوباره آن را بخوانید و با سؤال بالا مقایسه کنید.</p></div>`;
    h+=`<button class="pri" id="nx">${S.i+1<S.list.length?'سؤال بعدی':'نمایش نتیجه'}</button>`;
    $('#fb').innerHTML=h;$('#nx').onclick=()=>{S.i++;S.opts=null;render()};
  };
  btns.forEach((b,i)=>b.onclick=()=>{o.picked=i;const ok=o.list[i]===x;if(ok)S.score++;mark(x,ok);reveal()});
  if(o.picked!==null)reveal();
}

const STOP=new Set('nicht eine einer einem einen eines sich oder wird werden muss kann dass dann sind auch nach bei mit von für den der die das dem des ein und zum zur ist'.split(' '));
const toks=s=>(s.toLowerCase().match(/[\p{L}\d]+(?:[.,]\d+)?/gu)||[]);
function grade(x,text){
  const u=toks(text);
  return x.a.map(line=>{
    let t=toks(line);const sig=t.filter(w=>!STOP.has(w)&&(w.length>=4||/\d/.test(w)));
    if(!sig.length)t=t.filter(w=>w.length>1);else t=sig;
    if(!t.length)return{line,r:1};
    const hit=t.filter(w=>u.some(v=>/\d/.test(w)?v===w:v.startsWith(w.slice(0,Math.min(5,w.length)))||w.startsWith(v.slice(0,5))&&v.length>=5)).length;
    return{line,r:hit/t.length};
  });
}

function renderWR(){
  const x=S.list[S.i];
  app.innerHTML=head()+`<div class="card">${qHtml(x)}</div><textarea id="ta" placeholder="Ihre Antwort…" ${S.res?'readonly':''}>${esc(S.text||'')}</textarea><div id="fb"></div>
  <div class="row" style="margin-top:10px" id="btns"></div>`;
  const btns=$('#btns');
  if(S.res)return showRes(x);
  btns.innerHTML='<button class="pri" id="ck">بررسی پاسخ</button><button id="sk">نمی‌دانم، پاسخ را نشان بده</button>';
  $('#ck').onclick=()=>{const t=$('#ta').value.trim();if(!t){$('#fb').innerHTML='<div class="fb mid">ابتدا پاسخ را بنویسید یا گزینه‌ی «نمی‌دانم» را بزنید.</div>';return}
    S.text=t;S.res=grade(x,t);finish(x)};
  $('#sk').onclick=()=>{S.text='';S.res=x.a.map(l=>({line:l,r:0}));finish(x)};
}
function finish(x){
  const pct=S.res.reduce((s,p)=>s+(p.r>=.6?1:p.r),0)/S.res.length;
  S.pct=pct;const ok=pct>=.7;
  if(ok)S.score+=1;mark(x,ok);renderWR();
}
function showRes(x){
  const pct=S.pct,ok=pct>=.7,cls=ok?'ok':pct>=.4?'mid':'bad';
  const miss=S.res.filter(p=>p.r<.6);
  $('#fb').innerHTML=`<div class="fb ${cls}"><b>${ok?'✓ قبول':pct>=.4?'≈ ناقص':'✗ نادرست'} – ${fa(Math.round(pct*100))}٪</b>${miss.length?`<p>${fa(miss.length)} نکته را ننوشته‌اید یا ناقص نوشته‌اید. جدول پایین را ببینید.</p>`:'<p>همه‌ی نکته‌ها را پوشش دادید.</p>'}</div>
  <div class="card"><h2>مقایسه با پاسخ درست</h2><div class="de">${S.res.map(p=>`<div class="pt ${p.r>=.6?'y':p.r>.3?'h':'n'}"><b>${p.r>=.6?'✓':p.r>.3?'≈':'✗'}</b><span>${esc(p.line)}</span></div>`).join('')}</div>
  <p class="mute">✓ نوشته‌اید · ≈ ناقص · ✗ جاافتاده. مقایسه بر اساس کلمه‌های کلیدی است؛ اگر با عبارت دیگری همان مفهوم را نوشته‌اید، خودتان قضاوت کنید.</p></div>
  <button class="pri" id="nx">${S.i+1<S.list.length?'سؤال بعدی':'نمایش نتیجه'}</button>`;
  $('#nx').onclick=()=>{S.i++;S.res=null;S.text='';render()};
}

function renderEnd(){
  const n=S.list.length,pct=Math.round(S.score/n*100);
  app.innerHTML=`<div class="card"><div class="big">${fa(pct)}٪</div><p>${fa(Math.round(S.score*10)/10)} از ${fa(n)} سؤال درست</p></div>
  ${S.bad.length?`<div class="card"><h2>سؤال‌هایی که اشتباه بود</h2>${S.bad.map(x=>`<details><summary class="de">Aufgabe ${x.n} – ${esc(x.q)}</summary><div class="body de">${ansHtml(x)}</div></details>`).join('')}</div>`:'<div class="fb ok">همه را درست جواب دادید.</div>'}
  <div class="row"><button class="pri" id="again">آزمون تازه</button>${S.bad.length?'<button id="rw">تمرین فقط اشتباه‌ها</button>':''}</div>`;
  $('#again').onclick=()=>{S=null;render()};
  const r=$('#rw');if(r)r.onclick=()=>{S={list:shuffle(S.bad),i:0,score:0,bad:[]};render()};
}

function renderAll(){
  app.innerHTML=`<input type="search" id="se" placeholder="جستجو در سؤال‌ها و پاسخ‌ها (آلمانی)…" dir="ltr"><div class="row" style="margin-bottom:10px"><button class="chip" id="fw">فقط اشتباه‌های من</button><button id="cl">پاک کردن اشتباه‌ها</button></div><div id="lst"></div>`;
  let only=false;
  const draw=()=>{
    const q=$('#se').value.trim().toLowerCase();
    const L=items.filter(x=>(!only||wrong.has(x.n))&&(!q||(x.q+' '+x.a.join(' ')).toLowerCase().includes(q)));
    $('#lst').innerHTML=L.length?L.map(x=>`<details><summary class="de">Aufgabe ${x.n} – ${esc(x.q)}${wrong.has(x.n)?'<span class="flag">اشتباه</span>':''}</summary><div class="body de">${ansHtml(x)}</div></details>`).join(''):'<p class="mute">موردی پیدا نشد.</p>';
  };
  $('#se').oninput=draw;
  $('#fw').onclick=e=>{only=!only;e.target.classList.toggle('on',only);draw()};
  $('#cl').onclick=()=>{wrong.clear();save();setSub();draw()};
  draw();
}
render();
</script>
</body>
</html>
